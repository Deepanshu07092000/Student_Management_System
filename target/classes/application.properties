spring.application.name=student-management-system
server.port=8080

# MYSQL (create the sms_db database first: CREATE DATABASE sms_db;)
spring.datasource.url=jdbc:mysql://localhost:3306/SpringSecurity_Practice
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.batch.sms=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Redis cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
# Cache entries expire after 10 minutes so stale catalog data self-heals
spring.cache.redis.time-to-live=600000

# Multipart file upload (student photos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/student-images

# Swagger / OpenAPI UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator — exposed endpoints at /actuator/*. No authentication yet
# (that's added once Spring Security comes into the project), so treat
# these as visible to anyone who can reach this server for now.
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
info.app.name=Student Management System
info.app.description=Phase 2 — relationships, caching, auditing, enrollment workflow


# JWT Configuration
# Secret key must be Base64 encoded and sufficiently strong for HS256
jwt.secret=${JWT_SECRET}
# Access token validity: 15 minutes (in milliseconds)
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Debug Google OAuth2 login and token exchange
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.web=DEBUG